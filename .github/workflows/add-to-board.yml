name: Add issues to AI Initiatives board

on:
  issues:
    types: [opened]

# Uses a PAT, so the workflow token needs nothing.
permissions: {}

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/orgs/conceptadev/projects/6
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
