name: ci-merge
on:
  push:
    branches: ["main"]
  workflow_dispatch:
    branches: ["main"]
jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v2
      - name: Enable Corepack
        run: corepack enable
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}

      - uses: actions/cache@v3
        with:
          # Relative paths: '/node_modules' never exists and
          # hashFiles('/yarn.lock') hashes nothing, so the cache was
          # silently dead and every run cold-installed.
          path: node_modules
          key: ${{ runner.os }}-modules-${{ hashFiles('yarn.lock') }}

      - name: Install
        run: yarn --immutable
      - name: Build
        run: yarn build
      - name: Public API reports
        run: yarn api:report
      - name: Linting
        run: yarn lint:all
      - name: Typecheck tests
        run: yarn typecheck:spec
      - name: Unit tests
        run: yarn test:ci
      - name: E2E coverage
        run: yarn test:e2e:cov
      - name: Process Test Results
        uses: dorny/test-reporter@v1
        with:
          name: Tests
          path: "junit.xml"
          reporter: java-junit
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v2
        with:
          files: ./coverage/coverage-final.json,./coverage-e2e/coverage-final.json
          verbose: true
      - name: Upload coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: ./coverage/lcov.info,./coverage-e2e/lcov.info
