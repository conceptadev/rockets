name: ci-pr-test

on:
  # No base-branch filter: stacked PRs (branch → branch → main) must be gated
  # too. Filtering on 'main' left them with zero checks.
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # 20.19.0 is the published minimum (`engines`): the CommonJS build needs
        # `require(esm)` for the ESM Nest 12 line, so the floor is tested, not assumed.
        node-version: [20.19.0, 22.x]

    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - uses: actions/cache@v4
        with:
          # Relative paths: '/node_modules' never exists and
          # hashFiles('/yarn.lock') hashes nothing, so the cache was
          # silently dead and every run cold-installed.
          path: node_modules
          key: ${{ runner.os }}-modules-${{ hashFiles('yarn.lock') }}

      - name: Install
        run: yarn --immutable
      - name: Build
        run: yarn build
      - name: Public API reports
        run: yarn api:report:check-built
      - name: Linting
        run: yarn lint:all
      - name: Typecheck tests
        run: yarn typecheck:spec
      - name: Verify native Vitest config loading
        run: yarn test:config-native
      - name: Unit tests
        run: yarn test:ci
      - name: E2E coverage
        run: yarn test:e2e:cov
      - name: Save the PR number in an artifact
        shell: bash
        env:
          PR_NUM: ${{ github.event.number }}
        run: |
          echo $PR_NUM > ./pr_num.txt
      - name: Upload test-results artifact
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: test-results
          path: |
            pr_num.txt
            junit.xml
            coverage/lcov.info
            coverage/coverage-final.json
            coverage-e2e/lcov.info
            coverage-e2e/coverage-final.json
